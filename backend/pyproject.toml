[project]
name = "backend"
version = "0.1.0"
description = "Backend for digital credential wallet app"
authors = [
    {name = "W12B-Apple", email = "-"},
]
dependencies = ["requests>=2.32.5", "pydantic>=2.12.5", "cryptography>=43.0.3", "fastapi>=0.128.8", "uvicorn>=0.39.0", "pytest>=8.4.2", "urlextract", "bitstring", "dateparser", "qrcode", "jinja2>=3.1.6", "pillow"]
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}

[dependency-groups]
lint = ["pylint>=3.0.0"]
test = ["pytest", "pytest-cov"]

[tool.pdm]
distribution = false

[tool.pdm.scripts]
start = "python main.py"
test = "pytest"

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: tests that require external Walt.id services",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]