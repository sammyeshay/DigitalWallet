include:
  - ./waltid-identity/docker-compose/docker-compose.yaml

networks:
  backend-net:
    driver: bridge

services:
  backend:
    build: ./backend
    container_name: app-backend
    ports:
      - "8000:8000"
      - "8001:8001"
    networks:
      - backend-net
    environment:
      WALTID_WALLET_URL: http://wallet-api:7001
    volumes:
      - ${STATUS_LIST}:/app/bit_string_status_list.json
    env_file:
    - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      wallet-api:
        condition: service_healthy

  postgres:
    networks:
      backend-net:
        aliases:
          - postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waltid || exit 1"]
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 5s

  wallet-api:
    networks:
      - backend-net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:7001/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  issuer-api:
    networks:
      - backend-net

  verifier-api:
    networks:
      - backend-net
    environment:
      SERVICE_HOST: verifier-api

  verifier-api2:
    networks:
      - backend-net

  vc-repo:
    networks:
      - backend-net

  caddy:
    networks:
      - backend-net